name: Release

# Push a tag like v0.2.0 and this builds a signed APK and publishes it as a GitHub Release.
# The app's built-in updater then offers that release to everyone already running Lumen.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu runner already ships the Android SDK. The usual setup-android action breaks
      # now because it tries to install the removed "tools" package, so drive sdkmanager ourselves.
      - name: Install the SDK pieces the build needs
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)"
          test -n "$SDKMGR" || { echo "::error::sdkmanager not found under $SDK"; exit 1; }
          echo "Android SDK: $SDK"
          echo "sdkmanager: $SDKMGR"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
          echo "sdk.dir=$SDK" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The build signs with the same debug keystore the developer's phone trusts, stored as a
      # repository secret, so releases install straight over an existing installation.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is missing; the release would not be installable."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Derive version from the tag
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="${TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$NAME"
          PATCH="${PAT%%-*}"
          CODE=$((10#$MAJ * 10000 + 10#$MIN * 100 + 10#$PATCH))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (versionName=$NAME versionCode=$CODE)"

      - name: Build the release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PlumenVersionName="${{ steps.v.outputs.name }}" \
            -PlumenVersionCode="${{ steps.v.outputs.code }}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/lumen-${{ steps.v.outputs.tag }}.apk"
          sha256sum "dist/lumen-${{ steps.v.outputs.tag }}.apk" > "dist/lumen-${{ steps.v.outputs.tag }}.apk.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/lumen-${{ steps.v.outputs.tag }}.apk
            dist/lumen-${{ steps.v.outputs.tag }}.apk.sha256
